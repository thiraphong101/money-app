<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบปฏิทินเงินออม (Savings Tracker)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dashboard-header { background-color: #2c3e50; color: white; padding: 15px 20px; }
        .nav-tabs .nav-link { color: #2c3e50; font-weight: 500; cursor: pointer; }
        .nav-tabs .nav-link.active { font-weight: bold; border-bottom: 3px solid #3498db; }
        .tab-content { display: none; padding: 20px 0; }
        .tab-content.active { display: block; }
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .fc-event { cursor: pointer; }
        #slipPreview { max-width: 100%; height: auto; display: none; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Header & Login Mockup -->
    <div class="dashboard-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-piggy-bank"></i> ระบบจัดการเงินออม</h4>
        <div>
            <span class="me-3"><i class="fas fa-user-circle"></i> สมาชิก: <strong id="currentUser">Theerapong</strong></span>
            <button class="btn btn-sm btn-danger"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="container mt-4">
        <ul class="nav nav-tabs" id="myTab">
            <li class="nav-item">
                <a class="nav-link active" onclick="switchTab('tab1')"><i class="far fa-calendar-alt"></i> ปฏิทินเงินออม</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="switchTab('tab2')"><i class="fas fa-chart-line"></i> สรุปรายเงินออม</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="switchTab('tab3')"><i class="fas fa-cog"></i> ตั้งค่า</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger" onclick="switchTab('tab4')"><i class="fas fa-user-shield"></i> แอดมิน</a>
            </li>
        </ul>

        <!-- TAB 1: ปฏิทินเงินออม -->
        <div id="tab1" class="tab-content active">
            <div class="row">
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <h5>บันทึกการออมใหม่</h5>
                        <form id="savingForm">
                            <div class="mb-3">
                                <label class="form-label">กิจกรรมการออม</label>
                                <select class="form-select" id="activitySelect" required>
                                    <option value="">-- เลือกกิจกรรม --</option>
                                    <!-- Options generated by JS -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">วันที่ออม</label>
                                <input type="date" class="form-control" id="saveDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">จำนวนเงิน (บาท)</label>
                                <input type="number" class="form-control" id="saveAmount" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">แนบสลิป (อัปโหลดผ่าน ImgBB)</label>
                                <input type="file" class="form-control" id="slipFile" accept="image/*" required>
                                <img id="slipPreview" src="" alt="Slip Preview">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="btnSaveRecord">
                                <i class="fas fa-save"></i> บันทึกข้อมูล
                            </button>
                        </form>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card card-custom p-3">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: สรุปรายเงินออม -->
        <div id="tab2" class="tab-content">
            <div class="card card-custom p-3 mb-3">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <label class="form-label">เลือกโปรไฟล์สมาชิก</label>
                        <select class="form-select" id="profileSelect" onchange="renderSummary()">
                            <option value="Theerapong">Theerapong</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div id="summaryDashboard" class="row">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- TAB 3: ตั้งค่า -->
        <div id="tab3" class="tab-content">
            <div class="row">
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <h5>สร้างกิจกรรมการออม</h5>
                        <form id="activityForm">
                            <div class="mb-3">
                                <label class="form-label">ชื่อกิจกรรม</label>
                                <input type="text" class="form-control" id="actName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">เป้าหมายเงินออม (บาท)</label>
                                <input type="number" class="form-control" id="actGoal" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">บัญชีที่ใช้เก็บเงิน</label>
                                <input type="text" class="form-control" id="actAccount" required placeholder="เช่น SCB 123-456">
                            </div>
                            <button type="submit" class="btn btn-success w-100">เพิ่มกิจกรรม</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card card-custom p-3">
                        <h5>กิจกรรมการออมทั้งหมด</h5>
                        <table class="table table-striped mt-3">
                            <thead>
                                <tr>
                                    <th>ชื่อกิจกรรม</th>
                                    <th>เป้าหมาย</th>
                                    <th>บัญชี</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="activityTableBody">
                                <!-- Generated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 4: แอดมิน -->
        <div id="tab4" class="tab-content">
            <div class="card card-custom p-3">
                <h5>จัดการสมาชิก (Admin Panel)</h5>
                <table class="table mt-3">
                    <thead>
                        <tr>
                            <th>ชื่อสมาชิก</th>
                            <th>สถานะ</th>
                            <th>ลิมิตกิจกรรม</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr>
                            <td>Theerapong</td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td>ไม่จำกัด</td>
                            <td>
                                <button class="btn btn-sm btn-warning">แก้ไขลิมิต</button>
                                <button class="btn btn-sm btn-danger">ลบสมาชิก</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal สำหรับดูสลิปจากปฏิทิน -->
    <div class="modal fade" id="slipModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="slipModalTitle">รายละเอียดการออม</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="slipModalDetails"></p>
                    <img id="slipModalImg" src="" class="img-fluid rounded" alt="Slip">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    
    <script>
        // --- ค่าตั้งต้น ---
        const IMGBB_API_KEY = "ใส่_API_KEY_ของคุณที่นี่"; // สมัครและรับคีย์ที่ api.imgbb.com
        let activities = JSON.parse(localStorage.getItem('activities')) || [];
        let savings = JSON.parse(localStorage.getItem('savings')) || [];
        let calendar;

        // --- ระบบสลับแท็บ ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tabId === 'tab1') renderCalendar();
            if(tabId === 'tab2') renderSummary();
        }

        // --- เริ่มการทำงาน ---
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('saveDate').valueAsDate = new Date();
            updateActivityDropdown();
            renderActivityTable();
            initCalendar();
        });

        // --- TAB 3: จัดการกิจกรรม (ตั้งค่า) ---
        document.getElementById('activityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const act = {
                id: Date.now().toString(),
                name: document.getElementById('actName').value,
                goal: parseFloat(document.getElementById('actGoal').value),
                account: document.getElementById('actAccount').value
            };
            activities.push(act);
            localStorage.setItem('activities', JSON.stringify(activities));
            this.reset();
            updateActivityDropdown();
            renderActivityTable();
            alert('เพิ่มกิจกรรมสำเร็จ');
        });

        function renderActivityTable() {
            const tbody = document.getElementById('activityTableBody');
            tbody.innerHTML = '';
            activities.forEach(act => {
                tbody.innerHTML += `
                    <tr>
                        <td>${act.name}</td>
                        <td>${act.goal.toLocaleString()} ฿</td>
                        <td>${act.account}</td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="deleteActivity('${act.id}')">ลบ</button></td>
                    </tr>
                `;
            });
        }

        function deleteActivity(id) {
            activities = activities.filter(a => a.id !== id);
            localStorage.setItem('activities', JSON.stringify(activities));
            updateActivityDropdown();
            renderActivityTable();
        }

        function updateActivityDropdown() {
            const select = document.getElementById('activitySelect');
            select.innerHTML = '<option value="">-- เลือกกิจกรรม --</option>';
            activities.forEach(act => {
                select.innerHTML += `<option value="${act.id}">${act.name}</option>`;
            });
        }

        // --- TAB 1: อัปโหลดสลิป & บันทึก (ImgBB API) ---
        document.getElementById('savingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveRecord');
            const fileInput = document.getElementById('slipFile');
            
            if(fileInput.files.length === 0) return alert('กรุณาแนบสลิป');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังอัปโหลด...';

            const formData = new FormData();
            formData.append("image", fileInput.files[0]);

            try {
                // หากยังไม่ใส่ API Key ระบบจะใช้รูป Mockup ไปก่อนเพื่อให้ทดสอบได้
                let imgUrl = "https://i.ibb.co/placeholder.jpg"; 
                if (IMGBB_API_KEY !== "ใส่_API_KEY_ของคุณที่นี่") {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    imgUrl = data.data.url;
                }

                const record = {
                    id: Date.now().toString(),
                    activityId: document.getElementById('activitySelect').value,
                    date: document.getElementById('saveDate').value,
                    amount: parseFloat(document.getElementById('saveAmount').value),
                    slipUrl: imgUrl
                };

                savings.push(record);
                localStorage.setItem('savings', JSON.stringify(savings));
                
                this.reset();
                document.getElementById('saveDate').valueAsDate = new Date();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
                alert('บันทึกเงินออมเรียบร้อย');
                
                renderCalendar();

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการอัปโหลดรูปภาพ");
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
            }
        });

        // --- ปฏิทิน (FullCalendar) ---
        function initCalendar() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 500,
                locale: 'th',
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today'
                },
                eventClick: function(info) {
                    const data = info.event.extendedProps;
                    document.getElementById('slipModalTitle').innerText = info.event.title;
                    document.getElementById('slipModalDetails').innerHTML = `วันที่: ${info.event.startStr} <br> บัญชี: ${data.account}`;
                    document.getElementById('slipModalImg').src = data.slipUrl;
                    new bootstrap.Modal(document.getElementById('slipModal')).show();
                }
            });
            renderCalendar();
        }

        function renderCalendar() {
            if(!calendar) return;
            calendar.removeAllEvents();
            savings.forEach(save => {
                const act = activities.find(a => a.id === save.activityId);
                if(act) {
                    calendar.addEvent({
                        title: `${act.name}: ${save.amount}฿`,
                        start: save.date,
                        backgroundColor: '#27ae60',
                        borderColor: '#2ecc71',
                        extendedProps: {
                            slipUrl: save.slipUrl,
                            account: act.account
                        }
                    });
                }
            });
            calendar.render();
        }

        // --- TAB 2: สรุปและคาดการณ์ ---
        function renderSummary() {
            const dashboard = document.getElementById('summaryDashboard');
            dashboard.innerHTML = '';

            if(activities.length === 0) {
                dashboard.innerHTML = '<div class="col-12"><div class="alert alert-warning">ยังไม่มีกิจกรรมการออม</div></div>';
                return;
            }

            activities.forEach(act => {
                // คำนวณยอดรวมของกิจกรรมนี้
                const actSavings = savings.filter(s => s.activityId === act.id);
                const totalSaved = actSavings.reduce((sum, current) => sum + current.amount, 0);
                const percent = Math.min((totalSaved / act.goal) * 100, 100).toFixed(1);
                
                // คาดการณ์เป้าหมาย (คำนวณจากค่าเฉลี่ยต่อวัน)
                let projectionText = "ข้อมูลไม่เพียงพอในการคาดการณ์";
                if(actSavings.length >= 2) {
                    const dates = actSavings.map(s => new Date(s.date).getTime());
                    const minDate = Math.min(...dates);
                    const maxDate = Math.max(...dates);
                    const daysDiff = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24)) || 1;
                    
                    const avgPerDay = totalSaved / daysDiff;
                    const remaining = act.goal - totalSaved;
                    
                    if(remaining > 0 && avgPerDay > 0) {
                        const daysLeft = Math.ceil(remaining / avgPerDay);
                        const finishDate = new Date();
                        finishDate.setDate(finishDate.getDate() + daysLeft);
                        projectionText = `คาดว่าจะถึงเป้าหมาย: <strong>${finishDate.toLocaleDateString('th-TH')}</strong>`;
                    } else if (remaining <= 0) {
                        projectionText = `<span class="text-success"><i class="fas fa-check-circle"></i> บรรลุเป้าหมายแล้ว!</span>`;
                    }
                }

                dashboard.innerHTML += `
                    <div class="col-md-6 mb-4">
                        <div class="card card-custom p-3 border-start border-4 border-info">
                            <h5 class="text-info">${act.name}</h5>
                            <p class="mb-1 text-muted">เป้าหมาย: ${act.goal.toLocaleString()} บาท</p>
                            <h3 class="mb-3">${totalSaved.toLocaleString()} <span class="fs-6 text-muted">บาท</span></h3>
                            
                            <div class="progress mb-2" style="height: 20px;">
                                <div class="progress-bar bg-info" role="progressbar" style="width: ${percent}%;">${percent}%</div>
                            </div>
                            
                            <div class="mt-2 text-muted small">
                                <i class="fas fa-bullseye"></i> ${projectionText}
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
